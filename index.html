<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ 物理獸 DSE · Physics Pals</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF9F0;--ink:#2B2D42;--soft:#8A8F9E;--line:#EDE7DC;
  --card:#FFF;--shadow:0 4px 20px rgba(80,60,30,.08);
  --radius:22px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Noto Sans TC',-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:active{transform:scale(.96)}

/* ===== 通用 Screen ===== */
.screen{
  position:fixed;inset:0;
  display:none;flex-direction:column;
  overflow:hidden;
}
.screen.active{display:flex}

/* ===== 載入 ===== */
#loading{
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#FFE9C9,#FFD6E8,#D4E8FF);
}
#loading .logo{
  font-family:'Baloo 2',cursive;
  font-size:clamp(2rem,8vw,3.5rem);
  font-weight:800;text-align:center;
  background:linear-gradient(120deg,#F5A623,#EF476F,#9B5DE5);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pop 1s ease both;
}
#loading .sub{text-align:center;color:#fff;font-size:.9rem;margin-top:12px;opacity:.9}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* ===== 開始畫面 ===== */
#start{
  background:linear-gradient(160deg,#FFE9C9 0%,#FFD6E8 50%,#D4E8FF 100%);
  align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
#start .start-inner{max-width:480px;width:100%}
#start h1{
  font-family:'Baloo 2',cursive;
  font-size:clamp(2.2rem,9vw,3.6rem);
  font-weight:800;line-height:1.05;
  margin-bottom:8px;
  background:linear-gradient(120deg,#F5A623,#EF476F,#9B5DE5,#4CC9F0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
#start .tagline{font-size:.9rem;color:#5A5F6E;margin-bottom:36px;font-weight:500}
#start .pals-preview{
  display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
  margin-bottom:36px;
}
#start .pals-preview .pp{
  width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.9);
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;
  box-shadow:0 6px 16px rgba(80,60,30,.12);
  animation:bob 2.4s ease-in-out infinite;
}
#start .pals-preview .pp:nth-child(2){animation-delay:.2s}
#start .pals-preview .pp:nth-child(3){animation-delay:.4s}
#start .pals-preview .pp:nth-child(4){animation-delay:.6s}
#start .pals-preview .pp:nth-child(5){animation-delay:.8s}
#start .pals-preview .pp:nth-child(6){animation-delay:1s}
#start .pals-preview .pp:nth-child(7){animation-delay:1.2s}
#start .pals-preview .pp:nth-child(8){animation-delay:1.4s}
#start .pals-preview .pp:nth-child(9){animation-delay:1.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.start-btn{
  display:block;width:100%;
  padding:18px 24px;border-radius:999px;
  background:var(--ink);color:#fff;
  font-size:1.05rem;font-weight:700;
  box-shadow:0 12px 32px rgba(43,45,66,.3);
  transition:all .2s;
  margin-bottom:12px;
}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(43,45,66,.4)}
.start-btn.ghost{
  background:rgba(255,255,255,.85);color:var(--ink);
  box-shadow:0 6px 20px rgba(80,60,30,.1);
}

/* ===== 頂欄 ===== */
.topbar{
  flex-shrink:0;
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,249,240,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  z-index:10;
}
.topbar .tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.topbar .tb-title{
  font-family:'Baloo 2',cursive;
  font-size:1.1rem;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar .tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
  transition:all .2s;
  box-shadow:0 2px 8px rgba(80,60,30,.06);
}
.icon-btn:hover{transform:scale(1.08)}
.coin-pill{
  display:flex;align-items:center;gap:5px;
  padding:7px 14px;border-radius:999px;
  background:linear-gradient(120deg,#FFF3D6,#FFE9C9);
  border:1px solid #F5D89A;
  font-size:.85rem;font-weight:800;color:#8B6914;
}
.coin-pill .cp-emoji{font-size:1rem}

/* ===== 地圖 ===== */
#map .map-body{
  flex:1;overflow-y:auto;
  padding:16px 16px 100px;
}
.zone-list{display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.zone-item{
  background:#fff;
  border:2px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 4px 16px rgba(80,60,30,.06);
  transition:all .25s;
  position:relative;
  overflow:hidden;
  cursor:pointer;
}
.zone-item:hover:not(.locked){
  transform:translateY(-3px);
  box-shadow:0 12px 32px rgba(80,60,30,.14);
  border-color:var(--zc);
}
.zone-item.locked{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.zone-item.cleared::after{
  content:'✓ 完成';
  position:absolute;top:10px;right:10px;
  font-size:.65rem;font-weight:700;
  padding:3px 10px;border-radius:999px;
  background:#06D6A0;color:#fff;
}
.zone-emoji{
  width:60px;height:60px;flex-shrink:0;
  border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;
  background:linear-gradient(140deg,var(--zc-light),#fff);
  border:2px solid #fff;
  box-shadow:0 4px 12px rgba(80,60,30,.08);
}
.zone-info{flex:1;min-width:0}
.zone-name{
  font-family:'Baloo 2',cursive;
  font-size:1.15rem;font-weight:800;
  color:var(--zc);line-height:1.1;
  margin-bottom:3px;
}
.zone-sub{font-size:.78rem;color:var(--soft);margin-bottom:6px}
.zone-progress{
  display:flex;gap:4px;
}
.zone-progress .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--line);
}
.zone-progress .dot.done{background:var(--zc)}

/* ===== 戰鬥畫面 ===== */
#battle{
  background:linear-gradient(180deg,#F4F7FB 0%,#FFF9F0 100%);
}
#battle .arena{
  flex:1;
  display:flex;flex-direction:column;
  padding:16px;
  overflow-y:auto;
  position:relative;
}
.arena-stage{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
  padding:16px;
  background:rgba(255,255,255,.6);
  border-radius:var(--radius);
  border:1px solid var(--line);
  backdrop-filter:blur(8px);
}
.fighter{
  flex:1;display:flex;flex-direction:column;align-items:center;
  text-align:center;
}
.fighter .avatar{
  width:80px;height:80px;
  border-radius:50%;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  border:4px solid var(--fc);
  box-shadow:0 8px 24px rgba(80,60,30,.15);
  margin-bottom:8px;
  transition:transform .2s;
}
.fighter .avatar svg{width:60px;height:60px}
.fighter.enemy .avatar{background:#FFE0E9;border-color:#EF476F}
.fighter .name{
  font-size:.82rem;font-weight:700;margin-bottom:4px;
}
.fighter .hp-bar{
  width:100%;height:10px;border-radius:999px;
  background:rgba(0,0,0,.08);overflow:hidden;
  max-width:120px;
  position:relative;
}
.fighter .hp-fill{
  height:100%;
  background:linear-gradient(90deg,#06D6A0,#2EC4B6);
  border-radius:999px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
  width:100%;
}
.fighter.enemy .hp-fill{
  background:linear-gradient(90deg,#EF476F,#F72585);
}
.fighter .hp-text{
  font-size:.68rem;color:var(--soft);margin-top:3px;font-weight:600;
}
.vs-badge{
  font-family:'Baloo 2',cursive;
  font-size:1.2rem;font-weight:800;
  color:var(--soft);
  opacity:.6;
}

/* 戰鬥訊息 */
.battle-msg{
  text-align:center;
  padding:10px 16px;
  font-size:.85rem;font-weight:600;
  color:var(--soft);
  min-height:36px;
  transition:all .2s;
}
.battle-msg.good{color:#06D6A0}
.battle-msg.bad{color:#EF476F}

/* 題目卡 */
.question-card{
  background:#fff;
  border-radius:var(--radius);
  padding:22px 20px;
  box-shadow:0 12px 36px rgba(80,60,30,.12);
  border:1px solid var(--line);
  max-width:560px;
  margin:0 auto;
  width:100%;
}
.question-card .q-label{
  font-size:.7rem;font-weight:700;
  letter-spacing:.15em;color:var(--soft);
  margin-bottom:10px;
  display:flex;justify-content:space-between;
}
.question-card .q-label .q-progress{
  color:var(--fc,#F5A623);
}
.question-text{
  font-size:1rem;font-weight:700;
  line-height:1.7;
  margin-bottom:18px;
}
.answers{display:flex;flex-direction:column;gap:10px}
.answer-btn{
  padding:14px 16px;
  border-radius:14px;
  background:#FBF8F3;
  border:2px solid var(--line);
  font-size:.88rem;font-weight:500;
  text-align:left;
  line-height:1.6;
  color:var(--ink);
  transition:all .2s;
  display:flex;align-items:flex-start;gap:10px;
}
.answer-btn:hover:not(:disabled){
  border-color:var(--fc,#F5A623);
  background:#fff;
  transform:translateX(4px);
}
.answer-btn .key{
  flex-shrink:0;
  width:24px;height:24px;border-radius:50%;
  background:#EFE7DC;color:var(--soft);
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:800;
  transition:all .2s;
}
.answer-btn:hover:not(:disabled) .key{background:var(--fc,#F5A623);color:#fff}
.answer-btn.correct{
  border-color:#06D6A0;background:#E8FBF3;
}
.answer-btn.correct .key{background:#06D6A0;color:#fff}
.answer-btn.wrong{
  border-color:#EF476F;background:#FDE5EC;
}
.answer-btn.wrong .key{background:#EF476F;color:#fff}
.answer-btn:disabled{cursor:default}

/* 結果彈窗 */
.result-popup{
  position:fixed;inset:0;
  background:rgba(20,20,30,.6);
  backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
  z-index:100;padding:24px;
}
.result-popup.show{display:flex;animation:fadeIn .3s}
.result-popup .popup{
  background:#fff;
  border-radius:28px;
  padding:32px 26px;
  max-width:400px;width:100%;
  text-align:center;
  animation:popIn .4s cubic-bezier(.2,1.4,.4,1);
  box-shadow:0 30px 80px rgba(0,0,0,.3);
}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.result-popup .popup .popup-emoji{
  font-size:4rem;display:block;margin-bottom:12px;
  animation:bob 1.4s ease-in-out infinite;
}
.result-popup .popup h2{
  font-family:'Baloo 2',cursive;
  font-size:1.8rem;font-weight:800;
  margin-bottom:8px;
}
.result-popup .popup .popup-sub{
  color:var(--soft);font-size:.9rem;
  margin-bottom:20px;line-height:1.7;
}
.result-popup .popup .popup-rewards{
  display:flex;justify-content:center;gap:12px;
  margin-bottom:24px;
}
.result-popup .popup .reward{
  background:#FFF3D6;
  border:2px solid #F5D89A;
  border-radius:14px;
  padding:10px 16px;
  font-size:.85rem;font-weight:700;
  color:#8B6914;
  display:flex;align-items:center;gap:6px;
}
.result-popup .popup .popup-actions{
  display:flex;gap:10px;
}
.result-popup .popup .popup-actions button{
  flex:1;
  padding:14px 20px;
  border-radius:999px;
  font-size:.92rem;font-weight:700;
}
.result-popup .popup .popup-actions .btn-primary{
  background:var(--ink);color:#fff;
}
.result-popup .popup .popup-actions .btn-ghost{
  background:#FBF8F3;color:var(--ink);
  border:2px solid var(--line);
}

/* ===== 圖鑑 ===== */
#dex .dex-body{
  flex:1;overflow-y:auto;
  padding:16px 16px 100px;
}
.dex-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px;
  max-width:640px;margin:0 auto;
}
.dex-card{
  background:#fff;
  border:2px solid var(--line);
  border-radius:20px;
  padding:16px 12px;
  text-align:center;
  transition:all .25s;
  position:relative;
}
.dex-card.locked{
  background:#F4F1EC;
  opacity:.5;
}
.dex-card:not(.locked):hover{
  transform:translateY(-4px);
  border-color:var(--dc);
  box-shadow:0 12px 32px rgba(80,60,30,.14);
}
.dex-card .dc-avatar{
  width:70px;height:70px;margin:0 auto 8px;
  border-radius:50%;
  background:linear-gradient(140deg,var(--dc-light),#fff);
  border:3px solid #fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(80,60,30,.1);
}
.dex-card .dc-avatar svg{width:52px;height:52px}
.dex-card.locked .dc-avatar{background:#E8E4DD}
.dex-card.locked .dc-avatar::before{
  content:'?';font-size:2rem;font-weight:800;color:#B8B0A0;
}
.dex-card .dc-name{
  font-family:'Baloo 2',cursive;
  font-size:.9rem;font-weight:800;
  color:var(--dc);
  margin-bottom:2px;
}
.dex-card.locked .dc-name{color:var(--soft)}
.dex-card .dc-tag{
  font-size:.65rem;color:var(--soft);font-weight:600;
}
.dex-card .dc-level{
  position:absolute;top:8px;right:8px;
  font-size:.6rem;font-weight:800;
  background:var(--dc);color:#fff;
  padding:2px 8px;border-radius:999px;
}

/* ===== 底部導航 ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:8px 0 max(8px,env(safe-area-inset-bottom));
  z-index:50;
}
.bottom-nav .nav-item{
  flex:1;
  display:flex;flex-direction:column;align-items:center;
  gap:2px;
  padding:8px;
  color:var(--soft);
  font-size:.68rem;font-weight:600;
  transition:all .2s;
}
.bottom-nav .nav-item.active{color:var(--ink)}
.bottom-nav .nav-item .ni-icon{
  font-size:1.3rem;line-height:1;
}
.bottom-nav .nav-item.active .ni-icon{transform:scale(1.15)}

/* ===== 物理獸選擇 ===== */
#select .select-body{
  flex:1;overflow-y:auto;
  padding:16px 16px 100px;
}
.select-hint{
  text-align:center;color:var(--soft);font-size:.85rem;
  margin-bottom:16px;
}
.select-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:12px;max-width:640px;margin:0 auto;
}
.select-card{
  background:#fff;
  border:2px solid var(--line);
  border-radius:20px;
  padding:14px 10px;text-align:center;
  transition:all .25s;
  cursor:pointer;
}
.select-card:hover{
  transform:translateY(-4px);
  border-color:var(--sc);
  box-shadow:0 12px 32px rgba(80,60,30,.14);
}
.select-card .sc-avatar{
  width:64px;height:64px;margin:0 auto 8px;
  border-radius:50%;
  background:linear-gradient(140deg,var(--sc-light),#fff);
  display:flex;align-items:center;justify-content:center;
  border:3px solid #fff;
  box-shadow:0 4px 12px rgba(80,60,30,.1);
}
.select-card .sc-avatar svg{width:48px;height:48px}
.select-card .sc-name{
  font-family:'Baloo 2',cursive;
  font-size:.88rem;font-weight:800;color:var(--sc);
  margin-bottom:2px;
}
.select-card .sc-lv{
  font-size:.65rem;color:var(--soft);font-weight:600;
}

/* ===== 提示 ===== */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:var(--ink);color:#fff;
  padding:12px 22px;border-radius:999px;
  font-size:.85rem;font-weight:600;
  z-index:200;
  box-shadow:0 12px 32px rgba(0,0,0,.2);
  transition:transform .3s cubic-bezier(.2,1.4,.4,1);
  pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== 攻擊動畫 ===== */
@keyframes attackRight{
  0%{transform:translateX(0)}
  40%{transform:translateX(30px) scale(1.05)}
  100%{transform:translateX(0)}
}
@keyframes attackLeft{
  0%{transform:translateX(0)}
  40%{transform:translateX(-30px) scale(1.05)}
  100%{transform:translateX(0)}
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}
.attack-r{animation:attackRight .4s ease}
.attack-l{animation:attackLeft .4s ease}
.shake{animation:shake .4s ease}

@media(max-width:480px){
  .fighter .avatar{width:68px;height:68px}
  .fighter .avatar svg{width:52px;height:52px}
  .question-card{padding:18px 16px}
  .answer-btn{padding:12px 14px;font-size:.84rem}
}
</style>
</head>
<body>

<!-- ===== 載入 ===== -->
<div class="screen active" id="loading">
  <div>
    <div class="logo">⚡ Physics Pals</div>
    <div class="sub">載入中...</div>
  </div>
</div>

<!-- ===== 開始 ===== -->
<div class="screen" id="start">
  <div class="start-inner">
    <h1>物理獸 DSE</h1>
    <p class="tagline">可愛養成 × 物理解謎 × DSE 訓練</p>
    <div class="pals-preview">
      <div class="pp">🐱</div>
      <div class="pp">⚡</div>
      <div class="pp">🐰</div>
      <div class="pp">🐧</div>
      <div class="pp">🐻</div>
      <div class="pp">🦉</div>
      <div class="pp">🦊</div>
      <div class="pp">🦦</div>
      <div class="pp">🐶</div>
    </div>
    <button class="start-btn" id="btnNewGame">開始新遊戲</button>
    <button class="start-btn ghost" id="btnContinue" style="display:none">繼續遊戲</button>
  </div>
</div>

<!-- ===== 主畫面（地圖/圖鑑） ===== -->
<div class="screen" id="main">
  <!-- 地圖頁 -->
  <div id="map" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    <div class="topbar">
      <div class="tb-left">
        <div class="tb-title">🗺️ 物理島</div>
      </div>
      <div class="tb-right">
        <div class="coin-pill">
          <span class="cp-emoji">⚡</span>
          <span id="coinCount">0</span>
        </div>
      </div>
    </div>
    <div class="map-body">
      <div class="zone-list" id="zoneList"></div>
    </div>
  </div>

  <!-- 圖鑑頁 -->
  <div id="dex" style="display:none;flex-direction:column;flex:1;overflow:hidden">
    <div class="topbar">
      <div class="tb-left">
        <div class="tb-title">📖 物理獸圖鑑</div>
      </div>
    </div>
    <div class="dex-body">
      <div class="dex-grid" id="dexGrid"></div>
    </div>
  </div>

  <!-- 底部導航 -->
  <div class="bottom-nav">
    <button class="nav-item active" data-page="map">
      <span class="ni-icon">🗺️</span>
      <span>地圖</span>
    </button>
    <button class="nav-item" data-page="dex">
      <span class="ni-icon">📖</span>
      <span>圖鑑</span>
    </button>
  </div>
</div>

  unlockedZones: ['newton'],
  currentZone: null,
  currentPal: null,
  battle: null
};

var STORAGE_KEY = 'physics_pals_save_v1';

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      coins: state.coins,
      palLevels: state.palLevels,
      clearedZones: state.clearedZones,
      unlockedZones: state.unlockedZones
    }));
  }catch(e){}
}
function load(){
  try{
    var d = localStorage.getItem(STORAGE_KEY);
    if(!d) return false;
    var parsed = JSON.parse(d);
    state.coins = parsed.coins || 0;
    state.palLevels = parsed.palLevels || {};
    state.clearedZones = parsed.clearedZones || [];
    state.unlockedZones = parsed.unlockedZones || ['newton'];
    // 確保每隻物理獸有等級
    PALS.forEach(function(p){
      if(!state.palLevels[p.key]) state.palLevels[p.key] = 1;
    });
    return true;
  }catch(e){ return false; }
}
function hasSave(){
  return !!localStorage.getItem(STORAGE_KEY);
}

/* ============================================================
   UI 工具
   ============================================================ */
function $(id){ return document.getElementById(id); }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  $(id).classList.add('active');
}
function toast(msg, dur){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, dur || 1600);
}
function getPal(key){
  for(var i=0;i<PALS.length;i++) if(PALS[i].key===key) return PALS[i];
  return null;
}

    el.className = 'zone-item' + (locked ? ' locked' : '') + (cleared ? ' cleared' : '');

    el.style.setProperty('--zc-light', z.light);
    el.innerHTML =
      '<div class="zone-emoji">' + (locked ? '🔒' : z.emoji) + '</div>' +
      '<div class="zone-info">' +
        '<div class="zone-name">' + z.name + '</div>' +
        '<div class="zone-sub">' + z.sub + '</div>' +
        '<div class="zone-progress">' +
          '<span class="dot done"></span>' +
          '<span class="dot done"></span>' +
          '<span class="dot ' + (cleared?'done':'') + '"></span>' +
          '<span class="dot ' + (cleared?'done':'') + '"></span>' +
          '<span class="dot ' + (cleared?'done':'') + '"></span>' +
        '</div>' +
      '</div>';
    if(!locked){
      el.addEventListener('click', function(){ enterZone(z.id); });
    } else {
      el.addEventListener('click', function(){ toast('🔒 要先完成之前嘅地區'); });
    }
    list.appendChild(el);
  });
}

/* ============================================================
   圖鑑渲染
   ============================================================ */
function renderDex(){
  var grid = $('dexGrid');
  grid.innerHTML = '';
  PALS.forEach(function(p){
    var unlocked = state.palLevels[p.key] && state.palLevels[p.key] >= 1;
    var lv = state.palLevels[p.key] || 1;
    var el = document.createElement('div');
    el.className = 'dex-card' + (unlocked ? '' : ' locked');
    el.style.setProperty('--dc', p.color);
    el.style.setProperty('--dc-light', p.light);
    el.innerHTML =
      '<div class="dc-avatar">' + (unlocked ? p.svg : '') + '</div>' +
      '<div class="dc-name">' + (unlocked ? p.name : '？？？') + '</div>' +
      '<div class="dc-tag">' + (unlocked ? p.zone : '未解鎖') + '</div>' +
      (unlocked ? '<div class="dc-level">Lv.' + lv + '</div>' : '');
    if(unlocked){
      el.addEventListener('click', function(){
        toast(p.name + ' · ' + p.en + ' · Lv.' + lv);
      });
    }
    grid.appendChild(el);
  });
}

/* ============================================================
   底部導航
   ============================================================ */
document.querySelectorAll('.bottom-nav .nav-item').forEach(function(btn){
  btn.addEventListener('click', function(){
    var page = this.getAttribute('data-page');
    document.querySelectorAll('.bottom-nav .nav-item').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    $('map').style.display = page === 'map' ? 'flex' : 'none';
    $('dex').style.display = page === 'dex' ? 'flex' : 'none';
    if(page === 'dex') renderDex();
    if(page === 'map') renderMap();
  });
});

/* ============================================================
   物理獸選擇
   ============================================================ */
function enterZone(zoneId){
  var zone = ZONES.filter(function(z){ return z.id === zoneId; })[0];
  if(!zone) return;
  state.currentZone = zone;

  // 顯示可用物理獸
  var grid = $('selectGrid');
  grid.innerHTML = '';
  $('selectTitle').textContent = zone.name;

  // 該地區代表獸永遠可用，其他已解鎖地區代表獸也可用
  var availablePals = [];
  ZONES.forEach(function(z){
    if(state.unlockedZones.indexOf(z.id) !== -1){
      availablePals.push(z.pal);
    }
  });

  availablePals.forEach(function(pKey){
    var p = getPal(pKey);
    if(!p) return;
    var lv = state.palLevels[p.key] || 1;
    var el = document.createElement('div');
    el.className = 'select-card';
    el.style.setProperty('--sc', p.color);
    el.style.setProperty('--sc-light', p.light);
    el.innerHTML =
      '<div class="sc-avatar">' + p.svg + '</div>' +
      '<div class="sc-name">' + p.name + '</div>' +
      '<div class="sc-lv">Lv.' + lv + '</div>';
    el.addEventListener('click', function(){
      state.currentPal = pKey;
      startBattle();
    });
    grid.appendChild(el);
  });

  showScreen('select');
}

$('btnBackFromSelect').addEventListener('click', function(){
  showScreen('main');
  renderMap();
});

/* ============================================================
   戰鬥系統
   ============================================================ */
var BATTLE_HP = 100;

function startBattle(){
  var zone = state.currentZone;
  var pal = getPal(state.currentPal);
  var qs = QUESTIONS[zone.id] || QUESTIONS.newton;

  state.battle = {
    zone: zone,
    pal: pal,
    questions: qs.slice(),  // 複製
    qIndex: 0,
    playerHp: BATTLE_HP,
    playerMaxHp: BATTLE_HP,
    enemyHp: BATTLE_HP,
    enemyMaxHp: BATTLE_HP,
    correctCount: 0,
    answered: false
  };

  // 打亂題目順序
  state.battle.questions.sort(function(){ return Math.random() - 0.5; });

  // 更新 UI
  $('battleTitle').textContent = zone.name;
  $('playerAvatar').innerHTML = pal.svg;
  $('playerAvatar').style.borderColor = pal.color;
  $('playerName').textContent = pal.name;
  $('enemyAvatar').textContent = zone.enemy.emoji;
  $('enemyName').textContent = zone.enemy.name;
  $('coinCountBattle').textContent = state.coins;

  updateHpBars();
  showScreen('battle');
  renderQuestion();
}

function updateHpBars(){
  var b = state.battle;
  var pPct = (b.playerHp / b.playerMaxHp) * 100;
  var ePct = (b.enemyHp / b.enemyMaxHp) * 100;
  $('playerHp').style.width = pPct + '%';
  $('enemyHp').style.width = ePct + '%';
  $('playerHpText').textContent = b.playerHp + ' / ' + b.playerMaxHp;
  $('enemyHpText').textContent = b.enemyHp + ' / ' + b.enemyMaxHp;
}

function renderQuestion(){
  var b = state.battle;
  if(b.qIndex >= b.questions.length){
    endBattle();
    return;
  }
  b.answered = false;
  var q = b.questions[b.qIndex];
  $('qCategory').textContent = b.zone.sub.toUpperCase();
  $('qProgress').textContent = (b.qIndex + 1) + ' / ' + b.questions.length;
  $('questionText').textContent = q.q;

  var answersBox = $('answers');
  answersBox.innerHTML = '';
  var keys = ['A','B','C','D'];

  q.a.forEach(function(ansText, i){
    var btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = '<span class="key">' + keys[i] + '</span><span>' + ansText + '</span>';
    btn.addEventListener('click', function(){ answerQuestion(i, q.c); });
    answersBox.appendChild(btn);
  });

  $('battleMsg').textContent = '揀答案攻擊迷思獸！';
  $('battleMsg').className = 'battle-msg';
}

function answerQuestion(selected, correct){
  var b = state.battle;
  if(b.answered) return;
  b.answered = true;

  var btns = $('answers').querySelectorAll('.answer-btn');
  btns.forEach(function(btn, i){
    btn.disabled = true;
    if(i === correct) btn.classList.add('correct');
    if(i === selected && selected !== correct) btn.classList.add('wrong');
  });

  var isCorrect = selected === correct;
  var playerAvatar = $('playerAvatar');
  var enemyAvatar = $('enemyAvatar');

  if(isCorrect){
    b.correctCount++;
    var dmg = 25 + Math.floor(Math.random() * 6); // 25–30
    b.enemyHp = Math.max(0, b.enemyHp - dmg);
    $('battleMsg').textContent = '✅ 答對！' + b.pal.name + ' 攻擊！ -' + dmg + ' HP';
    $('battleMsg').className = 'battle-msg good';
    playerAvatar.classList.add('attack-r');
    setTimeout(function(){
      enemyAvatar.classList.add('shake');
      setTimeout(function(){
        playerAvatar.classList.remove('attack-r');
        enemyAvatar.classList.remove('shake');
      }, 400);
    }, 200);
  } else {
    var dmg2 = 18 + Math.floor(Math.random() * 6);
    b.playerHp = Math.max(0, b.playerHp - dmg2);
    $('battleMsg').textContent = '❌ 答錯！迷思獸反擊！ -' + dmg2 + ' HP';
    $('battleMsg').className = 'battle-msg bad';
    enemyAvatar.classList.add('attack-l');
    setTimeout(function(){
      playerAvatar.classList.add('shake');
      setTimeout(function(){
        enemyAvatar.classList.remove('attack-l');
        playerAvatar.classList.remove('shake');
      }, 400);
    }, 200);
  }

  updateHpBars();
  b.qIndex++;

  setTimeout(function(){
    if(b.enemyHp <= 0 || b.playerHp <= 0){
      endBattle();
    } else if(b.qIndex >= b.questions.length){
      endBattle();
    } else {
      renderQuestion();
    }
  }, 1200);
}

function endBattle(){
  var b = state.battle;
  var win = b.enemyHp <= 0 || (b.playerHp > 0 && b.correctCount >= Math.ceil(b.questions.length * 0.6));

  var popup = $('resultPopup');
  var emoji = $('popupEmoji');
  var title = $('popupTitle');
  var sub = $('popupSub');
  var rewards = $('popupRewards');

  if(win){
    // 勝利
    var coinReward = 20 + b.correctCount * 5;
    state.coins += coinReward;
    $('coinCount').textContent = state.coins;

    // 升級該地區物理獸
    var palKey = b.zone.pal;
    state.palLevels[palKey] = (state.palLevels[palKey] || 1) + 1;

    // 標記完成
    if(state.clearedZones.indexOf(b.zone.id) === -1){
      state.clearedZones.push(b.zone.id);
    }
    // 解鎖下一個地區
    var zoneIdx = ZONES.map(function(z){ return z.id; }).indexOf(b.zone.id);
    if(zoneIdx >= 0 && zoneIdx < ZONES.length - 1){
      var nextZone = ZONES[zoneIdx + 1];
      if(state.unlockedZones.indexOf(nextZone.id) === -1){
        state.unlockedZones.push(nextZone.id);
      }
    }
    save();

    emoji.textContent = '🏆';
    title.textContent = '勝利！';
    sub.textContent = '你打敗咗「' + b.zone.enemy.name + '」！\n答對 ' + b.correctCount + ' / ' + b.questions.length + ' 題';
    rewards.innerHTML =
      '<div class="reward">⚡ +' + coinReward + '</div>' +
      '<div class="reward">📈 ' + getPal(palKey).name + ' Lv.' + state.palLevels[palKey] + '</div>';
  } else {
    // 失敗
    emoji.textContent = '💀';
    title.textContent = '失敗...';
    sub.textContent = '迷思獸太強了！\n答對 ' + b.correctCount + ' / ' + b.questions.length + ' 題';
    rewards.innerHTML = '<div class="reward" style="background:#FDE5EC;border-color:#F5A0B0;color:#C42F4D">再接再厲！</div>';
  }

  popup.classList.add('show');
}

$('popupBack').addEventListener('click', function(){
  $('resultPopup').classList.remove('show');
  showScreen('main');
  renderMap();
  renderDex();
  $('coinCount').textContent = state.coins;
});

$('popupRetry').addEventListener('click', function(){
  $('resultPopup').classList.remove('show');
  startBattle();
});

$('btnQuitBattle').addEventListener('click', function(){
  if(confirm('確定要退出戰鬥嗎？進度唔會保存。')){
    showScreen('main');
    renderMap();
  }
});

/* ============================================================
   開始遊戲
   ============================================================ */
$('btnNewGame').addEventListener('click', function(){
  if(hasSave()){
    if(!confirm('已有存檔，確定要重新開始嗎？')){
      return;
    }
  }
  state = {
    coins: 0,
    palLevels: {},
    clearedZones: [],
    unlockedZones: ['newton'],
    currentZone: null,
    currentPal: null,
    battle: null
  };
  PALS.forEach(function(p){ state.palLevels[p.key] = 1; });
  save();
  $('coinCount').textContent = state.coins;
  showScreen('main');
  renderMap();
});

$('btnContinue').addEventListener('click', function(){
  if(load()){
    $('coinCount').textContent = state.coins;
    showScreen('main');
    renderMap();
  }
});

/* ============================================================
   初始化
   ============================================================ */
(function init(){
  // 載入存檔
  var loaded = load();
  if(loaded){
    $('btnContinue').style.display = 'block';
    $('coinCount').textContent = state.coins;
  } else {
    PALS.forEach(function(p){ state.palLevels[p.key] = 1; });
  }

  // 假載入動畫
  setTimeout(function(){
    showScreen('start');
  }, 800);
})();
</script>
