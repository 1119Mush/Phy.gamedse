<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ 物理獸 DSE · Physics Pals</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF9F0;--ink:#2B2D42;--soft:#8A8F9E;--line:#EDE7DC;
  --shadow:0 4px 20px rgba(80,60,30,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:active{transform:scale(.96)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* 開始 */
#start{background:linear-gradient(160deg,#FFE9C9 0%,#FFD6E8 50%,#D4E8FF 100%);align-items:center;justify-content:center;padding:24px;text-align:center}
#start .inner{max-width:480px;width:100%}
#start h1{font-family:'Baloo 2',cursive;font-size:clamp(2.2rem,9vw,3.6rem);font-weight:800;line-height:1.05;margin-bottom:8px;background:linear-gradient(120deg,#F5A623,#EF476F,#9B5DE5,#4CC9F0);-webkit-background-clip:text;background-clip:text;color:transparent}
#start .tag{font-size:.9rem;color:#5A5F6E;margin-bottom:36px;font-weight:500}
#start .pals{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:36px}
#start .pp{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 6px 16px rgba(80,60,30,.12);animation:bob 2.4s ease-in-out infinite}
#start .pp:nth-child(2){animation-delay:.2s}#start .pp:nth-child(3){animation-delay:.4s}
#start .pp:nth-child(4){animation-delay:.6s}#start .pp:nth-child(5){animation-delay:.8s}
#start .pp:nth-child(6){animation-delay:1s}#start .pp:nth-child(7){animation-delay:1.2s}
#start .pp:nth-child(8){animation-delay:1.4s}#start .pp:nth-child(9){animation-delay:1.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.start-btn{display:block;width:100%;padding:18px 24px;border-radius:999px;background:var(--ink);color:#fff;font-size:1.05rem;font-weight:700;box-shadow:0 12px 32px rgba(43,45,66,.3);margin-bottom:12px;transition:all .2s}
.start-btn:hover{transform:translateY(-2px)}
.start-btn.ghost{background:rgba(255,255,255,.85);color:var(--ink);box-shadow:0 6px 20px rgba(80,60,30,.1)}

/* 頂欄 */
.topbar{flex-shrink:0;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,249,240,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:10}
.topbar .tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.topbar .tb-title{font-family:'Baloo 2',cursive;font-size:1.1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 2px 8px rgba(80,60,30,.06)}
.coin-pill{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:999px;background:linear-gradient(120deg,#FFF3D6,#FFE9C9);border:1px solid #F5D89A;font-size:.85rem;font-weight:800;color:#8B6914}
.coin-pill .cp-emoji{font-size:1rem}

/* 地圖 */
#map .map-body{flex:1;overflow-y:auto;padding:16px 16px 100px}
.zone-list{display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.zone-item{background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px rgba(80,60,30,.06);transition:all .25s;position:relative;overflow:hidden;cursor:pointer}
.zone-item:hover:not(.locked){transform:translateY(-3px);box-shadow:0 12px 32px rgba(80,60,30,.14);border-color:var(--zc)}
.zone-item.locked{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.zone-item.cleared::after{content:'✓ CLEAR';position:absolute;top:10px;right:10px;font-size:.6rem;font-weight:700;padding:3px 10px;border-radius:999px;background:#06D6A0;color:#fff;letter-spacing:.05em}
.zone-emoji{width:60px;height:60px;flex-shrink:0;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;background:linear-gradient(140deg,var(--zc-light),#fff);border:2px solid #fff;box-shadow:0 4px 12px rgba(80,60,30,.08)}
.zone-info{flex:1;min-width:0}
.zone-name{font-family:'Baloo 2',cursive;font-size:1.15rem;font-weight:800;color:var(--zc);line-height:1.1;margin-bottom:3px}
.zone-sub{font-size:.75rem;color:var(--soft);margin-bottom:6px;font-family:'Baloo 2',cursive}
.zone-progress{display:flex;gap:4px}
.zone-progress .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.zone-progress .dot.done{background:var(--zc)}

/* 戰鬥 */
#battle{background:linear-gradient(180deg,#F4F7FB 0%,#FFF9F0 100%)}
#battle .arena{flex:1;display:flex;flex-direction:column;padding:16px;overflow-y:auto;position:relative}
.arena-stage{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;padding:16px;background:rgba(255,255,255,.6);border-radius:22px;border:1px solid var(--line);backdrop-filter:blur(8px)}
.fighter{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.fighter .avatar{width:80px;height:80px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;border:4px solid var(--fc);box-shadow:0 8px 24px rgba(80,60,30,.15);margin-bottom:8px;transition:transform .2s}
.fighter .avatar svg{width:60px;height:60px}
.fighter.enemy .avatar{background:#FFE0E9;border-color:#EF476F;font-size:2.4rem}
.fighter .name{font-size:.82rem;font-weight:700;margin-bottom:4px}
.fighter .hp-bar{width:100%;height:10px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden;max-width:120px;position:relative}
.fighter .hp-fill{height:100%;background:linear-gradient(90deg,#06D6A0,#2EC4B6);border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1);width:100%}
.fighter.enemy .hp-fill{background:linear-gradient(90deg,#EF476F,#F72585)}
.fighter .hp-text{font-size:.68rem;color:var(--soft);margin-top:3px;font-weight:600}
.vs-badge{font-family:'Baloo 2',cursive;font-size:1.2rem;font-weight:800;color:var(--soft);opacity:.6}

.battle-msg{text-align:center;padding:10px 16px;font-size:.85rem;font-weight:600;color:var(--soft);min-height:36px;transition:all .2s}
.battle-msg.good{color:#06D6A0}
.battle-msg.bad{color:#EF476F}

.question-card{background:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 12px 36px rgba(80,60,30,.12);border:1px solid var(--line);max-width:560px;margin:0 auto;width:100%}
.question-card .q-label{font-size:.7rem;font-weight:700;letter-spacing:.15em;color:var(--soft);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.question-card .q-label .q-progress{color:var(--fc,#F5A623)}
.diff-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.6rem;font-weight:800;letter-spacing:.05em}
.diff-1{background:#E8FBF3;color:#06D6A0}
.diff-2{background:#FFF3D6;color:#B8860B}
.diff-3{background:#FDE5EC;color:#C42F4D}
.question-text{font-size:1rem;font-weight:700;line-height:1.7;margin-bottom:18px;font-family:'Baloo 2','Noto Sans TC',sans-serif}
.answers{display:flex;flex-direction:column;gap:10px}
.answer-btn{padding:14px 16px;border-radius:14px;background:#FBF8F3;border:2px solid var(--line);font-size:.88rem;font-weight:500;text-align:left;line-height:1.6;color:var(--ink);transition:all .2s;display:flex;align-items:flex-start;gap:10px}
.answer-btn:hover:not(:disabled){border-color:var(--fc,#F5A623);background:#fff;transform:translateX(4px)}
.answer-btn .key{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#EFE7DC;color:var(--soft);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;transition:all .2s}
.answer-btn:hover:not(:disabled) .key{background:var(--fc,#F5A623);color:#fff}
.answer-btn.correct{border-color:#06D6A0;background:#E8FBF3}
.answer-btn.correct .key{background:#06D6A0;color:#fff}
.answer-btn.wrong{border-color:#EF476F;background:#FDE5EC}
.answer-btn.wrong .key{background:#EF476F;color:#fff}
.answer-btn:disabled{cursor:default}

/* 彈窗 */
.result-popup{position:fixed;inset:0;background:rgba(20,20,30,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}
.result-popup.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.result-popup .popup{background:#fff;border-radius:28px;padding:32px 26px;max-width:400px;width:100%;text-align:center;animation:popIn .4s cubic-bezier(.2,1.4,.4,1);box-shadow:0 30px 80px rgba(0,0,0,.3)}
.popup-emoji{font-size:4rem;display:block;margin-bottom:12px}
.popup h2{font-family:'Baloo 2',cursive;font-size:1.8rem;font-weight:800;margin-bottom:8px}
.popup .sub{color:var(--soft);font-size:.9rem;margin-bottom:20px;line-height:1.7}
.popup-rewards{display:flex;justify-content:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.reward{background:#FFF3D6;border:2px solid #F5D89A;border-radius:14px;padding:10px 16px;font-size:.85rem;font-weight:700;color:#8B6914;display:flex;align-items:center;gap:6px}
.popup-actions{display:flex;gap:10px}
.popup-actions button{flex:1;padding:14px 20px;border-radius:999px;font-size:.92rem;font-weight:700}
.btn-primary{background:var(--ink);color:#fff}
.btn-ghost{background:#FBF8F3;color:var(--ink);border:2px solid var(--line)}

/* 圖鑑 */
#dex .dex-body{flex:1;overflow-y:auto;padding:16px 16px 100px}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:640px;margin:0 auto}
.dex-card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px 12px;text-align:center;transition:all .25s;position:relative;cursor:pointer}
.dex-card.locked{background:#F4F1EC;opacity:.55;cursor:default}
.dex-card:not(.locked):hover{transform:translateY(-4px);border-color:var(--dc);box-shadow:0 12px 32px rgba(80,60,30,.14)}
.dex-card .dc-avatar{width:70px;height:70px;margin:0 auto 8px;border-radius:50%;background:linear-gradient(140deg,var(--dc-light),#fff);border:3px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(80,60,30,.1)}
.dex-card .dc-avatar svg{width:52px;height:52px}
.dex-card.locked .dc-avatar::before{content:'?';font-size:2rem;font-weight:800;color:#B8B0A0}
.dex-card .dc-name{font-family:'Baloo 2',cursive;font-size:.9rem;font-weight:800;color:var(--dc);margin-bottom:2px}
.dex-card.locked .dc-name{color:var(--soft)}
.dex-card .dc-tag{font-size:.65rem;color:var(--soft);font-weight:600}
.dex-card .dc-level{position:absolute;top:8px;right:8px;font-size:.6rem;font-weight:800;background:var(--dc);color:#fff;padding:2px 8px;border-radius:999px}

/* 底部導航 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:50}
.bottom-nav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;color:var(--soft);font-size:.68rem;font-weight:600;transition:all .2s}
.bottom-nav .nav-item.active{color:var(--ink)}
.bottom-nav .nav-item .ni-icon{font-size:1.3rem;line-height:1}
.bottom-nav .nav-item.active .ni-icon{transform:scale(1.15)}

/* 選擇 */
#select .select-body{flex:1;overflow-y:auto;padding:16px 16px 100px}
.select-hint{text-align:center;color:var(--soft);font-size:.85rem;margin-bottom:16px}
.select-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;max-width:640px;margin:0 auto}
.select-card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 10px;text-align:center;transition:all .25s;cursor:pointer}
.select-card:hover{transform:translateY(-4px);border-color:var(--sc);box-shadow:0 12px 32px rgba(80,60,30,.14)}
.select-card .sc-avatar{width:64px;height:64px;margin:0 auto 8px;border-radius:50%;background:linear-gradient(140deg,var(--sc-light),#fff);display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 4px 12px rgba(80,60,30,.1)}
.select-card .sc-avatar svg{width:48px;height:48px}
.select-card .sc-name{font-family:'Baloo 2',cursive;font-size:.88rem;font-weight:800;color:var(--sc);margin-bottom:2px}
.select-card .sc-lv{font-size:.65rem;color:var(--soft);font-weight:600}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:.85rem;font-weight:600;z-index:200;box-shadow:0 12px 32px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

@keyframes attackRight{0%{transform:translateX(0)}40%{transform:translateX(30px) scale(1.05)}100%{transform:translateX(0)}}
@keyframes attackLeft{0%{transform:translateX(0)}40%{transform:translateX(-30px) scale(1.05)}100%{transform:translateX(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.attack-r{animation:attackRight .4s ease}
.attack-l{animation:attackLeft .4s ease}
.shake{animation:shake .4s ease}

@media(max-width:480px){
  .fighter .avatar{width:68px;height:68px}
  .fighter .avatar svg{width:52px;height:52px}
  .question-card{padding:18px 16px}
  .answer-btn{padding:12px 14px;font-size:.84rem}
}
</style>
</head>
<body>

<!-- 開始 -->
<div class="screen active" id="start">
  <div class="inner">
    <h1>物理獸 DSE</h1>
    <p class="tag">Physics Pals · 可愛養成 × 物理解謎 × DSE 訓練</p>
    <div class="pals">
      <div class="pp">🐱</div><div class="pp">⚡</div><div class="pp">🐰</div>
      <div class="pp">🐧</div><div class="pp">🐻</div><div class="pp">🦉</div>
      <div class="pp">🦊</div><div class="pp">🦦</div><div class="pp">🐶</div>
    </div>
    <button class="start-btn" id="btnNewGame">開始新遊戲</button>
    <button class="start-btn ghost" id="btnContinue" style="display:none">繼續遊戲</button>
  </div>
</div>

<!-- 主畫面 -->
<div class="screen" id="main">
  <div id="map" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    <div class="topbar">
      <div class="tb-left"><div class="tb-title">🗺️ 物理島</div></div>
      <div class="tb-right">
        <div class="coin-pill"><span class="cp-emoji">⚡</span><span id="coinCount">0</span></div>
      </div>
    </div>
    <div class="map-body"><div class="zone-list" id="zoneList"></div></div>
  </div>
  <div id="dex" style="display:none;flex-direction:column;flex:1;overflow:hidden">
    <div class="topbar"><div class="tb-left"><div class="tb-title">📖 物理獸圖鑑</div></div></div>
    <div class="dex-body"><div class="dex-grid" id="dexGrid"></div></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-item active" data-page="map"><span class="ni-icon">🗺️</span><span>地圖</span></button>
    <button class="nav-item" data-page="dex"><span class="ni-icon">📖</span><span>圖鑑</span></button>
  </div>
</div>

<!-- 選擇 -->
<div class="screen" id="select">
  <div class="topbar">
    <div class="tb-left">
      <button class="icon-btn" id="btnBackFromSelect">←</button>
      <div class="tb-title" id="selectTitle">選擇物理獸</div>
    </div>
  </div>
  <div class="select-body">
    <p class="select-hint">揀一隻物理獸出戰，答對越多，佢升級越快！</p>
    <div class="select-grid" id="selectGrid"></div>
  </div>
</div>

<!-- 戰鬥 -->
<div class="screen" id="battle">
  <div class="topbar">
    <div class="tb-left">
      <button class="icon-btn" id="btnQuitBattle">←</button>
      <div class="tb-title" id="battleTitle">戰鬥中</div>
    </div>
    <div class="tb-right">
      <div class="coin-pill"><span class="cp-emoji">⚡</span><span id="coinCountBattle">0</span></div>
    </div>
  </div>
  <div class="arena">
    <div class="arena-stage">
      <div class="fighter enemy" id="enemyFighter">
        <div class="avatar" id="enemyAvatar">👾</div>
        <div class="name" id="enemyName">迷思獸</div>
        <div class="hp-bar"><div class="hp-fill" id="enemyHp"></div></div>
        <div class="hp-text" id="enemyHpText">100 / 100</div>
      </div>
      <div class="vs-badge">VS</div>
      <div class="fighter" id="playerFighter">
        <div class="avatar" id="playerAvatar">🐱</div>
        <div class="name" id="playerName">牛牛 Sir</div>
        <div class="hp-bar"><div class="hp-fill" id="playerHp"></div></div>
        <div class="hp-text" id="playerHpText">100 / 100</div>
      </div>
    </div>
    <div class="battle-msg" id="battleMsg">準備戰鬥...</div>
    <div class="question-card" id="questionCard">
      <div class="q-label">
        <span id="qCategory">FORCE & MOTION</span>
        <span class="q-progress" id="qProgress">1 / 5</span>
      </div>
      <div class="question-text" id="questionText">載入中...</div>
      <div class="answers" id="answers"></div>
    </div>
  </div>
</div>

<!-- 結算 -->
<div class="result-popup" id="resultPopup">
  <div class="popup">
    <span class="popup-emoji" id="popupEmoji">🏆</span>
    <h2 id="popupTitle">勝利！</h2>
    <p class="sub" id="popupSub"></p>
    <div class="popup-rewards" id="popupRewards"></div>
    <div class="popup-actions">
      <button class="btn-ghost" id="popupBack">返回地圖</button>
      <button class="btn-primary" id="popupRetry">再打一次</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   物理獸資料
   ============================================================ */
var PALS = [
  {key:'newton', name:'牛牛 Sir', en:'Newton Cat', color:'#F5A623', light:'#FFF3D6',
   zone:'牛頓競技場', emoji:'🐱',
   svg:'<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="58" rx="26" ry="22" fill="#F5A623"/><circle cx="50" cy="44" r="18" fill="#F5A623"/><path d="M 34 32 L 30 20 L 42 28 Z" fill="#F5A623"/><path d="M 66 32 L 70 20 L 58 28 Z" fill="#F5A623"/><circle cx="50" cy="30" r="7" fill="#E63946"/><path d="M 50 24 Q 52 20 54 24" stroke="#4A7C2F" stroke-width="2" fill="none"/><circle cx="44" cy="44" r="2.5" fill="#2c2c2c"/><circle cx="56" cy="44" r="2.5" fill="#2c2c2c"/><path d="M 46 52 Q 50 55 54 52" stroke="#2c2c2c" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'},
  {key:'zappy', name:'電電', en:'Zappy Eel', color:'#FFB703', light:'#FFF6DD',
   zone:'電磁都市', emoji:'⚡',
   svg:'<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="58" rx="30" ry="20" fill="#FFB703"/><path d="M 20 58 Q 30 50 50 58 Q 70 66 80 58" stroke="#3A0CA3" stroke-width="3" fill="none"/><circle cx="42" cy="48" r="3" fill="#2c2c2c"/><circle cx="58" cy="48" r="3" fill="#2c2c2c"/><path d="M 44 60 Q 50 64 56 60" stroke="#2c2c2c" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'},

var STORAGE_KEY = 'physics_pals_save_v2';
var state = {
  coins: 0,
  palLevels: {},
  clearedZones: [],
  unlockedZones: ['newton'],
  currentZone: null,
  currentPal: null,
  battle: null
};

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      coins: state.coins,
      palLevels: state.palLevels,
      clearedZones: state.clearedZones,
      unlockedZones: state.unlockedZones
    }));
  }catch(e){ console.warn('save failed', e); }
}
function load(){
  try{
    var d = localStorage.getItem(STORAGE_KEY);
    if(!d) return false;
    var p = JSON.parse(d);
    state.coins = p.coins || 0;
    state.palLevels = p.palLevels || {};
    state.clearedZones = p.clearedZones || [];
    state.unlockedZones = p.unlockedZones || ['newton'];
    PALS.forEach(function(pl){ if(!state.palLevels[pl.key]) state.palLevels[pl.key] = 1; });
    return true;
  }catch(e){ console.warn('load failed', e); return false; }
}
function hasSave(){
  try{ return !!localStorage.getItem(STORAGE_KEY); }catch(e){ return false; }
}

/* ============================================================
   工具
   ============================================================ */
function $(id){ return document.getElementById(id); }
function showScreen(id){
  var el = $(id);
  if(!el) return;
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  el.classList.add('active');
}
function toast(msg, dur){
  var t = $('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, dur || 1600);
}
function getPal(key){
  for(var i=0;i<PALS.length;i++) if(PALS[i].key===key) return PALS[i];
  return null;
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function renderMap(){
  var list = $('zoneList');
  if(!list) return;
  list.innerHTML = '';
  ZONES.forEach(function(z){
    var locked = state.unlockedZones.indexOf(z.id) === -1;
    var cleared = state.clearedZones.indexOf(z.id) !== -1;
    var el = document.createElement('div');
    el.className = 'zone-item' + (locked ? ' locked' : '') + (cleared ? ' cleared' : '');
    el.style.setProperty('--zc', z.color);
    el.style.setProperty('--zc-light', z.light);
    el.innerHTML =
      '<div class="zone-emoji">' + (locked ? '🔒' : z.emoji) + '</div>' +
      '<div class="zone-info">' +
        '<div class="zone-name">' + z.name + '</div>' +
        '<div class="zone-sub">' + z.sub + '</div>' +
        '<div class="zone-progress">' +
          '<span class="dot done"></span>' +
          '<span class="dot done"></span>' +
          '<span class="dot ' + (cleared?'done':'') + '"></span>' +
          '<span class="dot ' + (cleared?'done':'') + '"></span>' +
          '<span class="dot ' + (cleared?'done':'') + '"></span>' +
        '</div>' +
      '</div>';
    if(!locked){
      el.addEventListener('click', function(){ enterZone(z.id); });
    } else {
      el.addEventListener('click', function(){ toast('🔒 要先完成之前嘅地區'); });
    }
    list.appendChild(el);
  });
}

  PALS.forEach(function(p){
    var unlocked = state.palLevels[p.key] && state.palLevels[p.key] >= 1;
    var lv = state.palLevels[p.key] || 1;
    var el = document.createElement('div');
    el.className = 'dex-card' + (unlocked ? '' : ' locked');
    el.style.setProperty('--dc', p.color);
    el.style.setProperty('--dc-light', p.light);
    el.innerHTML =
      '<div class="dc-avatar">' + (unlocked ? p.svg : '') + '</div>' +
      '<div class="dc-name">' + (unlocked ? p.name : '？？？') + '</div>' +
      '<div class="dc-tag">' + (unlocked ? p.zone : '未解鎖') + '</div>' +
      (unlocked ? '<div class="dc-level">Lv.' + lv + '</div>' : '');
    if(unlocked){
      el.addEventListener('click', function(){
        toast(p.name + ' · ' + p.en + ' · Lv.' + lv);
      });
    }
    grid.appendChild(el);
  });
}

/* ============================================================
   底部導航
   ============================================================ */
document.querySelectorAll('.bottom-nav .nav-item').forEach(function(btn){
  btn.addEventListener('click', function(){
    var page = this.getAttribute('data-page');
    document.querySelectorAll('.bottom-nav .nav-item').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    $('map').style.display = page === 'map' ? 'flex' : 'none';
    $('dex').style.display = page === 'dex' ? 'flex' : 'none';
    if(page === 'dex') renderDex();
    if(page === 'map') renderMap();
  });
});

/* ============================================================
   選擇物理獸
   ============================================================ */
function enterZone(zoneId){
  var zone = null;
  for(var i=0;i<ZONES.length;i++) if(ZONES[i].id === zoneId) zone = ZONES[i];
  if(!zone) return;
  state.currentZone = zone;

  var grid = $('selectGrid');
  if(!grid) return;
  grid.innerHTML = '';
  $('selectTitle').textContent = zone.name;

  var available = [];
  ZONES.forEach(function(z){
    if(state.unlockedZones.indexOf(z.id) !== -1) available.push(z.pal);
  });

  available.forEach(function(pKey){
    var p = getPal(pKey);
    if(!p) return;
    var lv = state.palLevels[p.key] || 1;
    var el = document.createElement('div');
    el.className = 'select-card';
    el.style.setProperty('--sc', p.color);
    el.style.setProperty('--sc-light', p.light);
    el.innerHTML =
      '<div class="sc-avatar">' + p.svg + '</div>' +
      '<div class="sc-name">' + p.name + '</div>' +
      '<div class="sc-lv">Lv.' + lv + '</div>';
    el.addEventListener('click', function(){
      state.currentPal = pKey;
      startBattle();
    });
    grid.appendChild(el);
  });

  showScreen('select');
}

$('btnBackFromSelect').addEventListener('click', function(){
  showScreen('main');
  renderMap();
});

/* ============================================================
   戰鬥系統
   ============================================================ */
var BATTLE_HP = 100;
var QUESTIONS_PER_BATTLE = 5;

function startBattle(){
  var zone = state.currentZone;
  var pal = getPal(state.currentPal);
  if(!zone || !pal) return;
  var pool = QUESTIONS[zone.id] || QUESTIONS.newton;

  // 隨機抽 5 題（保持難度梯度：先易後難）
  var byDiff = {1:[], 2:[], 3:[]};
  pool.forEach(function(q){ byDiff[q.d].push(q); });
  var picked = [];
  // 先抽 2 題 easy、2 題 medium、1 題 hard（如不足則由其他難度補）
  function pickFrom(list, n){
    var s = shuffle(list);
    var out = s.slice(0, n);
    return out;
  }
  picked = picked.concat(pickFrom(byDiff[1], 2));
  picked = picked.concat(pickFrom(byDiff[2], 2));
  picked = picked.concat(pickFrom(byDiff[3], 1));

  // 如果唔夠 5 題，補齊
  var all = shuffle(pool);
  for(var i=0; i<all.length && picked.length < QUESTIONS_PER_BATTLE; i++){
    if(picked.indexOf(all[i]) === -1) picked.push(all[i]);
  }
  // 最後打亂順序，但仍然建議由淺入深
  picked.sort(function(a,b){ return a.d - b.d; });

  state.battle = {
    zone: zone,
    pal: pal,
    questions: picked,
    qIndex: 0,
    playerHp: BATTLE_HP,
    playerMaxHp: BATTLE_HP,
    enemyHp: BATTLE_HP,
    enemyMaxHp: BATTLE_HP,
    correctCount: 0,
    answered: false
  };

  // UI
  $('battleTitle').textContent = zone.name;
  $('playerAvatar').innerHTML = pal.svg;
  $('playerAvatar').style.borderColor = pal.color;
  $('playerAvatar').style.setProperty('--fc', pal.color);
  $('playerName').textContent = pal.name;
  $('enemyAvatar').textContent = zone.enemy.emoji;
  $('enemyName').textContent = zone.enemy.name;
  $('coinCountBattle').textContent = state.coins;

  updateHpBars();
  showScreen('battle');
  renderQuestion();
}

function updateHpBars(){
  var b = state.battle;
  if(!b) return;
  var pPct = (b.playerHp / b.playerMaxHp) * 100;
  var ePct = (b.enemyHp / b.enemyMaxHp) * 100;
  $('playerHp').style.width = pPct + '%';
  $('enemyHp').style.width = ePct + '%';
  $('playerHpText').textContent = b.playerHp + ' / ' + b.playerMaxHp;
  $('enemyHpText').textContent = b.enemyHp + ' / ' + b.enemyMaxHp;
}

var DIFF_LABEL = {1:{t:'EASY', c:'diff-1'}, 2:{t:'MEDIUM', c:'diff-2'}, 3:{t:'HARD', c:'diff-3'}};

function renderQuestion(){
  var b = state.battle;
  if(!b) return;
  if(b.qIndex >= b.questions.length){
    endBattle();
    return;
  }
  b.answered = false;
  var q = b.questions[b.qIndex];
  var diff = DIFF_LABEL[q.d] || DIFF_LABEL[1];

  $('qCategory').innerHTML = b.zone.sub.toUpperCase() +
    ' <span class="diff-badge ' + diff.c + '">' + diff.t + '</span>';
  $('qProgress').textContent = (b.qIndex + 1) + ' / ' + b.questions.length;
  $('questionText').textContent = q.q;

  var answersBox = $('answers');
  answersBox.innerHTML = '';

  // 打亂選項，記住正確答案新位置
  var opts = shuffle(q.opts.map(function(text, i){
    return {text: text, correct: i === q.c};
  }));

  var keys = ['A','B','C','D'];
  opts.forEach(function(opt, i){
    var btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = '<span class="key">' + keys[i] + '</span><span>' + opt.text + '</span>';
    btn.addEventListener('click', function(){
      answerQuestion(i, opts.map(function(o){ return o.correct; }));
    });
    answersBox.appendChild(btn);
  });

  $('battleMsg').textContent = '揀答案攻擊迷思獸！';
  $('battleMsg').className = 'battle-msg';
}

function answerQuestion(selectedIdx, correctMap){
  var b = state.battle;
  if(!b || b.answered) return;
  b.answered = true;

  var correctIdx = correctMap.indexOf(true);
  var isCorrect = selectedIdx === correctIdx;

  var btns = $('answers').querySelectorAll('.answer-btn');
  btns.forEach(function(btn, i){
    btn.disabled = true;
    if(i === correctIdx) btn.classList.add('correct');
    if(i === selectedIdx && !isCorrect) btn.classList.add('wrong');
  });

  var playerAvatar = $('playerAvatar');
  var enemyAvatar = $('enemyAvatar');

  if(isCorrect){
    b.correctCount++;
    var dmg = 25 + Math.floor(Math.random() * 6);
    b.enemyHp = Math.max(0, b.enemyHp - dmg);
    $('battleMsg').textContent = '✅ Correct! ' + b.pal.name + ' attacks! -' + dmg + ' HP';
    $('battleMsg').className = 'battle-msg good';
    playerAvatar.classList.add('attack-r');
    setTimeout(function(){
      enemyAvatar.classList.add('shake');
      setTimeout(function(){
        playerAvatar.classList.remove('attack-r');
        enemyAvatar.classList.remove('shake');
      }, 400);
    }, 200);
  } else {
    var dmg2 = 18 + Math.floor(Math.random() * 6);
    b.playerHp = Math.max(0, b.playerHp - dmg2);
    $('battleMsg').textContent = '❌ Wrong! The Myth Beast strikes back! -' + dmg2 + ' HP';
    $('battleMsg').className = 'battle-msg bad';
    enemyAvatar.classList.add('attack-l');
    setTimeout(function(){
      playerAvatar.classList.add('shake');
      setTimeout(function(){
        enemyAvatar.classList.remove('attack-l');
        playerAvatar.classList.remove('shake');
      }, 400);
    }, 200);
  }

  updateHpBars();
  b.qIndex++;

  setTimeout(function(){
    if(b.enemyHp <= 0 || b.playerHp <= 0 || b.qIndex >= b.questions.length){
      endBattle();
    } else {
      renderQuestion();
    }
  }, 1200);
}

function endBattle(){
  var b = state.battle;
  if(!b) return;
  var win = b.enemyHp <= 0 || (b.playerHp > 0 && b.correctCount >= Math.ceil(b.questions.length * 0.6));

  var popup = $('resultPopup');
  var emoji = $('popupEmoji');
  var title = $('popupTitle');
  var sub = $('popupSub');
  var rewards = $('popupRewards');

  if(win){
    var coinReward = 20 + b.correctCount * 5;
    state.coins += coinReward;
    $('coinCount').textContent = state.coins;

    var palKey = b.zone.pal;
    state.palLevels[palKey] = (state.palLevels[palKey] || 1) + 1;

    if(state.clearedZones.indexOf(b.zone.id) === -1){
      state.clearedZones.push(b.zone.id);
    }
    var zoneIdx = -1;
    for(var i=0;i<ZONES.length;i++) if(ZONES[i].id === b.zone.id) zoneIdx = i;
    if(zoneIdx >= 0 && zoneIdx < ZONES.length - 1){
      var nextZone = ZONES[zoneIdx + 1];
      if(state.unlockedZones.indexOf(nextZone.id) === -1){
        state.unlockedZones.push(nextZone.id);
      }
    }
    save();

    emoji.textContent = '🏆';
    title.textContent = 'Victory!';
    sub.textContent = 'You defeated "' + b.zone.enemy.name + '"!\nCorrect: ' + b.correctCount + ' / ' + b.questions.length;
    rewards.innerHTML =
      '<div class="reward">⚡ +' + coinReward + '</div>' +
      '<div class="reward">📈 ' + getPal(palKey).name + ' Lv.' + state.palLevels[palKey] + '</div>';
  } else {
    emoji.textContent = '💀';
    title.textContent = 'Defeated...';
    sub.textContent = 'The Myth Beast was too strong!\nCorrect: ' + b.correctCount + ' / ' + b.questions.length;
    rewards.innerHTML = '<div class="reward" style="background:#FDE5EC;border-color:#F5A0B0;color:#C42F4D">Try again!</div>';
  }

  popup.classList.add('show');
}

$('popupBack').addEventListener('click', function(){
  $('resultPopup').classList.remove('show');
  state.battle = null;
  showScreen('main');
  renderMap();
  renderDex();
  $('coinCount').textContent = state.coins;
});

$('popupRetry').addEventListener('click', function(){
  $('resultPopup').classList.remove('show');
  state.battle = null;
  startBattle();
});

$('btnQuitBattle').addEventListener('click', function(){
  if(confirm('Quit the battle? Progress will not be saved.')){
    state.battle = null;
    showScreen('main');
    renderMap();
  }
});

/* ============================================================
   開始 / 繼續
   ============================================================ */
$('btnNewGame').addEventListener('click', function(){
  if(hasSave() && !confirm('已有存檔，確定要重新開始嗎？')) return;
  state = {
    coins: 0,
    palLevels: {},
    clearedZones: [],
    unlockedZones: ['newton'],
    currentZone: null,
    currentPal: null,
    battle: null
  };
  PALS.forEach(function(p){ state.palLevels[p.key] = 1; });
  save();
  $('coinCount').textContent = state.coins;
  showScreen('main');
  renderMap();
  renderDex();
});

$('btnContinue').addEventListener('click', function(){
  if(load()){
    $('coinCount').textContent = state.coins;
    showScreen('main');
    renderMap();
    renderDex();
  }
});

/* ============================================================
   初始化（穩健版）
   ============================================================ */
function boot(){
  try{
    var loaded = load();
    if(loaded){
      $('btnContinue').style.display = 'block';
      $('coinCount').textContent = state.coins;
    } else {
      PALS.forEach(function(p){ state.palLevels[p.key] = 1; });
    }
    // 預渲染
    renderMap();
    renderDex();
  }catch(e){
    console.error('boot error', e);
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
